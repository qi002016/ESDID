# 一键起：Agent + Milvus(standalone) + Redis + Postgres
#
#   cd agent && cp .env.example .env   # 填入 SILICONFLOW_API_KEY / DEEPSEEK_API_KEY
#   docker compose up -d --build
#   open http://localhost:8000/docs
#
# 注意：本文件在无 Docker 的机器上未做端到端验证（开发机 Milvus 跑在虚拟机里），
# 如果你的环境跑不通，请对照 README「本地运行」一节逐项排查。
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 容器内互访用 service name
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      REDIS_URL: redis://redis:6379/0
      PG_HOST: postgres
      MYSQL_HOST: host.docker.internal
      CORS_ORIGINS: "*"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d rag_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  pg_data: