<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>电商看板 · Text-to-SQL 双 Agent 问答助手</title>
    <!-- ECharts 通过 CDN 引入（离线环境可下载到本地 web/ 目录） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1a3a5c, #2b6cb0);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header .status {
            font-size: 12px;
            opacity: .85;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user {
            align-self: flex-end;
            background: #2b6cb0;
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .bot {
            align-self: flex-start;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
            border-bottom-left-radius: 2px;
        }

        .thinking {
            align-self: flex-start;
            color: #888;
            font-size: 13px;
            font-style: italic;
        }

        .chart {
            align-self: flex-start;
            width: 90%;
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
        }

        .chart .ct {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .chart .box {
            width: 100%;
            height: 320px;
        }

        #inputbar {
            padding: 14px 24px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #inputbar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #inputbar input:focus {
            border-color: #2b6cb0;
        }

        #inputbar button {
            padding: 10px 22px;
            background: #2b6cb0;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        #inputbar button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .examples {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 24px 0;
        }

        .examples span {
            font-size: 12px;
            color: #2b6cb0;
            background: #e8f0fb;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
        }

        .examples span:hover {
            background: #d3e5f9;
        }

        /* 调试面板：SQL 默认隐藏，点击展开 */
        #debugbar {
            padding: 4px 24px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        #debugbar button {
            font-size: 12px;
            color: #6b7280;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 3px 12px;
            cursor: pointer;
            white-space: nowrap;
            margin-top: 2px;
        }

        #debugbar button:hover {
            background: #e5e7eb;
        }

        #debugsql {
            display: none;
            background: #1e293b;
            color: #a5f3fc;
            font-family: Consolas, monospace;
            font-size: 12px;
            border-radius: 8px;
            padding: 10px 14px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
            max-height: 140px;
            overflow-y: auto;
        }

        #debugsql.show {
            display: block;
        }
    </style>
</head>
<body>
<header>
    <h1>🛒 电商销售数据洞察 · Text-to-SQL 双 Agent</h1>
    <span class="status" id="health">连接中…</span>
</header>

<div class="examples">
    <span onclick="ask(this.textContent)">上个月整体销售额和订单数是多少</span>
    <span onclick="ask(this.textContent)">各品类销售额占比</span>
    <span onclick="ask(this.textContent)">最近7天手机品类销售趋势</span>
    <span onclick="ask(this.textContent)">2026年12月销售额环比变化多少</span>
    <span onclick="ask(this.textContent)">12月各品类目标达成率</span>
</div>

<div id="chat"></div>

<!-- 调试面板：SQL 默认不展示给用户，需要时点按钮展开 -->
<div id="debugbar">
    <button onclick="toggleDebug()">🔍 调试：查看 SQL</button>
    <pre id="debugsql"></pre>
</div>

<div id="inputbar">
    <input id="q" onkeydown="if(event.key==='Enter')send()"
           placeholder="用自然语言问数据，例如：上个月各品类销售额是多少？"
           type="text">
    <button id="btn" onclick="send()">发送</button>
</div>

<script>
    // session_id：会话记忆键（指代消解依赖它）。存在 localStorage，刷新页面保持同一会话。
    const SESSION_KEY = "text2sql_session_id";
    let sessionId = localStorage.getItem(SESSION_KEY) || ("sess_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    localStorage.setItem(SESSION_KEY, sessionId);

    const chat = document.getElementById("chat");
    let busy = false;

    // ---------- 消息渲染 ----------
    function addMsg(cls, text) {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function addThinking(text) {
        const div = document.createElement("div");
        div.className = "thinking";
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    // SQL 不进聊天流：只存入调试面板，用户点"调试"才看到
    let lastSQL = "";

    function saveSQL(text) {
        lastSQL = text;
        document.getElementById("debugsql").textContent = "SQL: " + text;
    }

    function toggleDebug() {
        document.getElementById("debugsql").classList.toggle("show");
    }

    function addChart(chart) {
        const wrap = document.createElement("div");
        wrap.className = "chart";
        const title = document.createElement("div");
        title.className = "ct";
        title.textContent = chart.title || "";
        const box = document.createElement("div");
        box.className = "box";
        wrap.appendChild(title);
        wrap.appendChild(box);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
        // ECharts 渲染
        if (window.echarts) {
            const inst = echarts.init(box);
            inst.setOption(chart.option || {});
            window.addEventListener("resize", () => inst.resize());
        } else {
            box.textContent = "（未加载 ECharts，请检查网络）";
        }
    }

    // ---------- SSE 流式接收 ----------
    async function send() {
        const input = document.getElementById("q");
        const text = input.value.trim();
        if (!text || busy) return;
        busy = true;
        document.getElementById("btn").disabled = true;
        input.value = "";
        addMsg("user", text);

        const resp = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({session_id: sessionId, message: text}),
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            addMsg("bot", "请求失败：" + (err.msg || resp.status));
            busy = false;
            document.getElementById("btn").disabled = false;
            return;
        }

        // 解析 text/event-stream：按空行分帧，取 data: 后的 JSON
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let pendingBot = null;

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});
            const frames = buffer.split("\n\n");
            buffer = frames.pop() || ""; // 最后一段可能不完整
            for (const frame of frames) {
                for (const line of frame.split("\n")) {
                    if (!line.startsWith("data: ")) continue;
                    let evt;
                    try {
                        evt = JSON.parse(line.slice(6));
                    } catch (e) {
                        continue;
                    }
                    handleEvent(evt);
                }
            }
        }
        busy = false;
        document.getElementById("btn").disabled = false;
    }

    function handleEvent(evt) {
        switch (evt.type) {
            case "thinking":
                addThinking("⏳ " + evt.content);
                break;
            case "sql":
                saveSQL(evt.content);
                break;
            case "answer":
                addMsg("bot", evt.content);
                break;
            case "chart":
                addChart(evt.content);
                break;
            case "done":
                break;
        }
    }

    function ask(text) {
        document.getElementById("q").value = text;
        send();
    }

    // ---------- 健康检查 ----------
    fetch("/health").then(r => r.json()).then(d => {
        const el = document.getElementById("health");
        el.textContent = "DB: " + (d.db.connected ? "✓" : "✗") + " · 订单 " + (d.db.orders_count || "-") + " 条 · 存储: " + d.vector_store + " · 记忆: " + d.memory;
    }).catch(() => {
    });
</script>
</body>
</html>
