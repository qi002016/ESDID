server:
  port: 8080
  # 注意：不要设成 /api，接口路径本身已含 /api
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${heima.datasource.driver-class-name}
    url: jdbc:mysql://${heima.datasource.host}:${heima.datasource.port}/${heima.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${heima.datasource.username}
    password: ${heima.datasource.password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  servlet:
    multipart:
      # CSV 批量导入（A18）
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    # 关键：null 字段也要返回（前端靠 null 判断「无对比数据」）
    default-property-inclusion: always
  sql:
    init:
      # 启动时执行 db/schema.sql（全部 CREATE TABLE IF NOT EXISTS，幂等）
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  data:
    redis:
      host: ${heima.redis.host}
      port: ${heima.redis.port}
      password: ${heima.redis.password}
      database: ${heima.redis.database}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    # 聚合 SQL 调试可切换为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn

# 本项目的业务配置（CORS / 导入 / 预聚合）
dashboard:
  cors:
    allowed-origins:
      - http://localhost:5500
      - http://localhost:5173
      - http://localhost
      - http://127.0.0.1
      - http://127.0.0.1:5173
  import:
    batch-size: 500
    max-error-detail: 500
  schedule:
    daily-summary-cron: "0 30 1 * * ?"

logging:
  level:
    com.heima: debug
    com.heima.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    dateformat: HH:mm:ss:SSS